[project]
name = "FMDatasetSparkChallenge"
version = "0.1.0"
description = "Spark analysis of Last.fm music sessions"
requires-python = ">=3.9"
dependencies = [
    "pyspark==3.4.1",
    "pandas>=2.0.0,<2.2.0",
    "pyarrow>=12.0.0,<15.0.0",
    "prophet==1.3.0",
    "scikit-learn>=1.2,<1.4"
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
[build-system]
requires = ["setuptools", "wheel", "uv"]
build-backend = "setuptools.build_meta"